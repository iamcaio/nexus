<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Icone do NEXUS Mobile.
       Fonte para gerar os PNGs do manifest: rode gerar_icones.py.
       Area segura para mascara (maskable): o "N" fica dentro do circulo
       central de 40% do raio, entao nenhum recorte de Android o corta. -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#2eaadc"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="#191919"/>
  <rect x="56" y="56" width="400" height="400" rx="88" fill="url(#g)"/>

  <!-- Letra N desenhada como caminho, para nao depender de fonte instalada -->
  <path fill="#ffffff" d="
    M 176 168
    h 40
    l 80 108
    v -108
    h 40
    v 176
    h -40
    l -80 -108
    v 108
    h -40
    z
  "/>
</svg>
